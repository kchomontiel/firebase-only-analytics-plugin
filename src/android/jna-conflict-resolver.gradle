// JNA Conflict Resolver for Firebase Analytics Plugin
// This file resolves META-INF conflicts between JNA dependencies

// Add packaging options to resolve META-INF conflicts
android {
    packagingOptions {
        pickFirst 'META-INF/AL2.0'
        pickFirst 'META-INF/LGPL2.1'
        pickFirst 'META-INF/DEPENDENCIES'
        pickFirst 'META-INF/LICENSE'
        pickFirst 'META-INF/LICENSE.txt'
        pickFirst 'META-INF/NOTICE'
        pickFirst 'META-INF/NOTICE.txt'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
    }
}

// Exclude conflicting JNA dependencies
configurations.all {
    exclude group: 'net.java.dev.jna', module: 'jna'
    exclude group: 'net.java.dev.jna', module: 'jna-platform'
}
