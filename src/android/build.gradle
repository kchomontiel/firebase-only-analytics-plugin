android {

  packagingOptions {
    exclude 'META-INF/NOTICE'
    exclude 'META-INF/LICENSE'
  }
}


cdvPluginPostBuildExtras.add({
  afterEvaluate {
    rootProject.subprojects {
      if (name == "app") {
        // Disable Firebase Performance to prevent initialization issues
        android {
          buildTypes {
            debug {
              firebasePerformance {
                instrumentationEnabled false
              }
            }
            release {
              firebasePerformance {
                instrumentationEnabled false
              }
            }
          }
        }
      }
    }
  }
})

